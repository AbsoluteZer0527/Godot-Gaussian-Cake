[preset.0]
name="Desktop PCK"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="examples/slime/assets/manifest.json,examples/slime/assets/forms/library.json,examples/transitions/assets/library.json,examples/transitions/palette.json"
exclude_filter="examples/transitions/authoring/*,examples/slime/assets/morphs/*.gcsplat,examples/slime/assets/rest/*.gcsplat,tests/*,tools/*,docs/*,out/*,examples/assets/*.obj,examples/assets/*.gcproject,addons/gaussian_cake/editor/*,addons/gaussian_cake/plugin.gd"
export_path="out/gaussian-cake.pck"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
